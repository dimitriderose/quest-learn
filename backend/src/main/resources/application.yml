spring:
  application:
    name: questlearn-backend
  
  profiles:
    active: ${SPRING_PROFILE:dev}
  
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param

questlearn:
  gemini:
    api-key: ${GEMINI_API_KEY}
    project-id: ${GOOGLE_CLOUD_PROJECT_ID}
    location: us-central1
    model: gemini-1.5-pro-002
  
  firebase:
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}
  
  standards:
    api-url: ${STANDARDS_API_URL:https://api.commonstandardsproject.com}
  
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

common-standards:
  api:
    base-url: ${COMMON_STANDARDS_API_URL:https://api.commonstandardsproject.com}
    timeout-seconds: ${COMMON_STANDARDS_API_TIMEOUT_SECONDS:10}
    max-retries: ${COMMON_STANDARDS_API_MAX_RETRIES:2}
  cache:
    ttl-hours: ${COMMON_STANDARDS_CACHE_TTL_HOURS:24}
    max-size: ${COMMON_STANDARDS_CACHE_MAX_SIZE:1000}
    db-ttl-days: ${COMMON_STANDARDS_DB_CACHE_DAYS:7}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  
  oauth2:
    authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS}
    allowed-domains: ${OAUTH2_ALLOWED_DOMAINS:}

logging:
  level:
    com.questlearn: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO
    org.springframework.security: DEBUG
