# Development Profile Configuration
# This profile is used for LOCAL DEVELOPMENT ONLY
# Activated by setting SPRING_PROFILES_ACTIVE=dev

spring:
  # Database Configuration for Local Development
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
  
  # OAuth2 Development Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# JWT Development Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 hours
  
  oauth2:
    # Development redirect URIs (frontend)
    authorized-redirect-uris: ${OAUTH2_REDIRECT_URIS:http://localhost:3000/auth/callback}
    # Empty = allow ALL Google accounts for development
    allowed-domains: ${OAUTH2_ALLOWED_DOMAINS:}

logging:
  level:
    com.questlearn: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
