# Docker Compose for LOCAL DEVELOPMENT
# This configuration runs:
# 1. PostgreSQL - Primary database
# 2. Spring Boot Backend - API server
#
# SETUP:
# 1. Create .env file with required variables (see .env.example)
# 2. Run: docker-compose -f docker-compose.dev.yml up
# 3. Access:
#    - Backend API: http://localhost:8081
#    - PostgreSQL: localhost:5432

version: '3.8'

services:
  # PostgreSQL Database - Primary data store
  postgres:
    image: postgres:15-alpine
    container_name: questlearn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - questlearn

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: questlearn-backend
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: dev
      
      # PostgreSQL Connection (container name 'postgres' resolves via Docker network)
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      
      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      
      # OAuth2 Configuration
      OAUTH2_REDIRECT_URIS: ${OAUTH2_REDIRECT_URIS:-http://localhost:3000/auth/callback}
      OAUTH2_ALLOWED_DOMAINS: ${OAUTH2_ALLOWED_DOMAINS:-}
      
      # Gemini AI (from .env file)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      
      # Standards API
      STANDARDS_API_URL: ${STANDARDS_API_URL:-https://api.commonstandardsproject.com}
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      
      # Server Port (internal)
      PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - questlearn
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  questlearn:
    driver: bridge

volumes:
  postgres_data:
    driver: local
