# Docker Compose for LOCAL DEVELOPMENT
# This configuration runs:
# 1. PostgreSQL - Primary database
# 2. Spring Boot Backend - API server
# 3. Next.js Frontend - Web application
#
# SETUP:
# 1. Create .env file with required variables (see .env.example)
# 2. Run: docker-compose -f docker-compose.dev.yml up
# 3. Access:
#    - Frontend: http://localhost:3000
#    - Backend API: http://localhost:8081
#    - PostgreSQL: localhost:5432

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: questlearn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - questlearn

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: questlearn-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      
      OAUTH2_REDIRECT_URIS: ${OAUTH2_REDIRECT_URIS:-http://localhost:3000/auth/callback}
      OAUTH2_ALLOWED_DOMAINS: ${OAUTH2_ALLOWED_DOMAINS:-}
      
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      
      STANDARDS_API_URL: ${STANDARDS_API_URL:-https://api.commonstandardsproject.com}
      
      COMMON_STANDARDS_API_URL: ${COMMON_STANDARDS_API_URL:-https://api.commonstandardsproject.com}
      COMMON_STANDARDS_CACHE_TTL_HOURS: ${COMMON_STANDARDS_CACHE_TTL_HOURS:-24}
      COMMON_STANDARDS_CACHE_MAX_SIZE: ${COMMON_STANDARDS_CACHE_MAX_SIZE:-1000}
      COMMON_STANDARDS_DB_CACHE_DAYS: ${COMMON_STANDARDS_DB_CACHE_DAYS:-7}
      COMMON_STANDARDS_API_TIMEOUT_SECONDS: ${COMMON_STANDARDS_API_TIMEOUT_SECONDS:-10}
      COMMON_STANDARDS_API_MAX_RETRIES: ${COMMON_STANDARDS_API_MAX_RETRIES:-2}
      
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      
      PORT: 8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - questlearn
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: node:20-alpine
    container_name: questlearn-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev"
    depends_on:
      - backend
    networks:
      - questlearn
    restart: on-failure

networks:
  questlearn:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local
